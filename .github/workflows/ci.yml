name: Go CI

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+' # Push events to matching v*, i.e. v20.15.10
  pull_request:
    branches:
      - '**'

jobs:

  coverage:
    name: 100% Statement Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Verify 100% Statement Coverage
        run: |
          go test -count=1 -coverprofile=cover.out ./...
          awk 'NR>1 && $NF==0 {print; bad=1} END{exit bad}' cover.out

  strongo_workflow:
    needs: coverage
    permissions:
      contents: write
    uses: strongo/cicd/.github/workflows/workflow.yml@main
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
